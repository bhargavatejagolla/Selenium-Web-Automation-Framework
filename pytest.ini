[pytest]
minversion = 8.0
addopts = -v --html=reports/report.html --self-contained-html --capture=no --reruns 1 --reruns-delay 1
testpaths = automation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Tests for critical functionality (Login, Register, Logout)
    regression: Full test suite (all tests)
    e2e: End-to-end authentication flow